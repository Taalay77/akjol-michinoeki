name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # GitHub ReleasesへAPKを自動アップロードするための書き込み権限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Generate fixed debug keystore (for seamless overwrite install)
        run: |
          rm -f android/app/debug.keystore
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK for direct download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk akjol-michinoeki.apk

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AKJOL 道の駅ログ (最新版)
          body: 最新の自動ビルド版APKです。下の「akjol-michinoeki.apk」をタップして直接ダウンロード・上書きインストールできます。
          files: akjol-michinoeki.apk
          prerelease: false
